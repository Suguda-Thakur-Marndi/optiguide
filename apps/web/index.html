<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiGuide: Preliminary Vision Screening and Eyewear Guidance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-forest-green: #073F35;
        --color-deep-green: #092D28;
        --color-muted-teal: #4F8278;
        --color-warm-ivory: #F7F4EC;
        --color-stone: #E9E5DA;
        --color-stone-light: #F0ECE2;
        --color-charcoal: #202823;
        --color-secondary-text: #686F69;
        --color-border: #D7D2C4;
        --color-border-subtle: #E4DFD3;
        --color-success: #28734F;
        --color-warning: #B77932;
        --color-error: #A9473E;
        --font-heading: 'Lora', Georgia, serif;
        --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--color-warm-ivory);
        color: var(--color-charcoal);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--color-deep-green);
        line-height: 1.3;
      }
      button, input, select, textarea {
        font-family: var(--font-body);
      }
      /* Visible focus indicator for accessibility */
      :focus-visible {
        outline: 2px solid var(--color-forest-green);
        outline-offset: 2px;
      }
      @keyframes skeleton-pulse {
        0%, 100% { opacity: 0.85; background-color: #E4DFD3; }
        50% { opacity: 0.45; background-color: #D7D2C4; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
