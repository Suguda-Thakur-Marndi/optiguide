  <!-- Right Cat-Eye Winged Rim -->
  <path d="M 690 75 Q 575 95 465 112 Q 455 195 510 225 Q 585 235 655 212 Q 695 160 690 75 Z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"/>

  <!-- Bridge -->
